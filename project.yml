# XcodeGen spec. Run `xcodegen generate` to produce colon3.xcodeproj (it's gitignored).
name: colon3
options:
  bundleIdPrefix: com.srjw
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  SoulseekKit:
    path: Packages/SoulseekKit

targets:
  colon3:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: SoulseekKit
      - target: TransfersWidget
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Seekios
        CFBundleName: Seekios
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        Colon3Channel: "$(COLON3_CHANNEL)"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSLocalNetworkUsageDescription: "Seekios uses the local network for Wi-Fi Transfer, so a computer on your Wi-Fi can add or download files."
        CFBundleURLTypes:
          - CFBundleURLName: com.srjw.seekios
            CFBundleURLSchemes: [colon3, seekios]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
              - public.mp3
              - public.mpeg-4-audio
              - com.apple.m4a-audio
              - org.xiph.flac
              - com.microsoft.waveform-audio
              - public.aiff-audio
              - public.aifc-audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srjw.seekios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        COLON3_CHANNEL: stable
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    scheme: {}

  # Live Activity (Dynamic Island / Lock Screen) for transfers.
  TransfersWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Support/Widget-Info.plist
      properties:
        CFBundleDisplayName: Seekios Transfers
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srjw.seekios.TransfersWidget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

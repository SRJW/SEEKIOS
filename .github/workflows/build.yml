name: CI/CD

on:
  push:
    branches: [main, beta]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out version numbers
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="1.0.${GITHUB_RUN_NUMBER}"
          fi
          channel=stable
          if [[ "$GITHUB_REF" == refs/heads/beta || "$version" == *-* ]]; then channel=beta; fi
          version="${version%%-*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Version $version (build $GITHUB_RUN_NUMBER, $channel)"

      - name: Use the newest Xcode on the runner
        run: |
          latest="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | grep -vi beta | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project colon3.xcodeproj \
            -scheme colon3 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            COLON3_CHANNEL="${{ steps.version.outputs.channel }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          if [ ! -f build/Build/Products/Release-iphoneos/colon3.app/colon3 ]; then
            echo "=== ERROR DE COMPILACION EN XCODE ==="
            grep -E "error:" xcodebuild.log -B 2 -A 2 || tail -n 50 xcodebuild.log
            exit 1
          fi

      - name: Generate Dynamic Color App Icons & Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/colon3.app Payload/

          cat << 'EOF' > generate_icons.swift
          import AppKit
          import CoreGraphics
          import CoreText
          import Foundation

          let fm = FileManager.default
          var hexColors = Set<String>()

          // 1. Registra cualquier archivo de fuente .otf / .ttf presente en el repositorio (ej. YWFTClarify-Black.otf)
          if let enumerator = fm.enumerator(atPath: ".") {
              while let file = enumerator.nextObject() as? String {
                  let lower = file.lowercased()
                  if lower.hasSuffix(".otf") || lower.hasSuffix(".ttf") {
                      let url = URL(fileURLWithPath: file) as CFURL
                      CTFontManagerRegisterFontsForURL(url, .process, nil)
                  }
                  if file.hasPrefix("App/") && file.hasSuffix(".swift"),
                     let content = try? String(contentsOfFile: file, encoding: .utf8) {
                      let pattern = "#?([0-9A-Fa-f]{6})\\b"
                      if let regex = try? NSRegularExpression(pattern: pattern) {
                          let nsRange = NSRange(content.startIndex..<content.endIndex, in: content)
                          for match in regex.matches(in: content, range: nsRange) {
                              if let r = Range(match.range(at: 1), in: content) {
                                  hexColors.insert(String(content[r]).uppercased())
                              }
                          }
                      }
                  }
              }
          }

          // 2. Busca el icono original del proyecto para conservar exactamente la misma "S"
          var baseIconRep: NSBitmapImageRep? = nil
          if let enumerator = fm.enumerator(atPath: ".") {
              while let file = enumerator.nextObject() as? String {
                  if file.contains("AppIcon.appiconset") && file.lowercased().hasSuffix(".png") {
                      if let data = try? Data(contentsOf: URL(fileURLWithPath: file)),
                         let rep = NSBitmapImageRep(data: data),
                         rep.pixelsWide >= 120 {
                          baseIconRep = rep
                          break
                      }
                  }
              }
          }

          func drawIcon(hex: String, size: Int, outputPath: String) {
              guard let val = UInt32(hex, radix: 16) else { return }
              let rCol = CGFloat((val >> 16) & 0xFF) / 255.0
              let gCol = CGFloat((val >> 8) & 0xFF) / 255.0
              let bCol = CGFloat(val & 0xFF) / 255.0

              let rep = NSBitmapImageRep(
                  bitmapDataPlanes: nil,
                  pixelsWide: size,
                  pixelsHigh: size,
                  bitsPerSample: 8,
                  samplesPerPixel: 4,
                  hasAlpha: true,
                  isPlanar: false,
                  colorSpaceName: .deviceRGB,
                  bytesPerRow: 0,
                  bitsPerPixel: 0
              )!

              // Si se subió YWFTClarify-Black.otf al repo, usa directamente la fuente oficial
              let fontSize = CGFloat(size) * 0.65
              if let customFont = NSFont(name: "YWFTClarify-Black", size: fontSize) {
                  NSGraphicsContext.saveGraphicsState()
                  NSGraphicsContext.current = NSGraphicsContext(bitmapImageRep: rep)

                  NSColor(deviceRed: rCol, green: gCol, blue: bCol, alpha: 1.0).setFill()
                  NSBezierPath(rect: NSRect(x: 0, y: 0, width: size, height: size)).fill()

                  let attrs: [NSAttributedString.Key: Any] = [
                      .font: customFont,
                      .foregroundColor: NSColor.white
                  ]
                  let text = "S" as NSString
                  let textSize = text.size(withAttributes: attrs)
                  let textRect = NSRect(
                      x: (CGFloat(size) - textSize.width) / 2.0,
                      y: (CGFloat(size) - textSize.height) / 2.0,
                      width: textSize.width,
                      height: textSize.height
                  )
                  text.draw(in: textRect, withAttributes: attrs)
                  NSGraphicsContext.restoreGraphicsState()
              } else if let src = baseIconRep {
                  // Si no está el archivo .otf pero sí el AppIcon.png original, conserva la "S" blanca original píxel por píxel y cambia solo el fondo
                  let srcW = src.pixelsWide
                  let srcH = src.pixelsHigh
                  for y in 0..<size {
                      let sy = min(srcH - 1, (y * srcH) / size)
                      for x in 0..<size {
                          let sx = min(srcW - 1, (x * srcW) / size)
                          let c = src.colorAt(x: sx, y: sy)?.usingColorSpace(.deviceRGB)
                          let cr = c?.redComponent ?? 0
                          let cg = c?.greenComponent ?? 0
                          let cb = c?.blueComponent ?? 0
                          // Calcula qué tan blanco es el píxel en el icono original (la letra "S")
                          let minChannel = min(cr, min(cg, cb))
                          let maxChannel = max(cr, max(cg, cb))
                          let saturation = maxChannel > 0 ? (maxChannel - minChannel) / maxChannel : 0
                          let whiteness = max(0, min(1, (minChannel - 0.35) / 0.60)) * (1.0 - saturation * 0.5)

                          let finalR = rCol * (1.0 - whiteness) + 1.0 * whiteness
                          let finalG = gCol * (1.0 - whiteness) + 1.0 * whiteness
                          let finalB = bCol * (1.0 - whiteness) + 1.0 * whiteness
                          rep.setColor(NSColor(deviceRed: finalR, green: finalG, blue: finalB, alpha: 1.0), atX: x, y: y)
                      }
                  }
              }

              if let pngData = rep.representation(using: .png, properties: [:]) {
                  try? pngData.write(to: URL(fileURLWithPath: outputPath))
              }
          }

          let appPath = "Payload/colon3.app"
          let plistPath = "\(appPath)/Info.plist"
          var alternateIcons: [String: Any] = [:]

          for hex in hexColors {
              let iconName = "AppIcon_\(hex)"
              drawIcon(hex: hex, size: 180, outputPath: "\(appPath)/\(iconName)@3x.png")
              drawIcon(hex: hex, size: 120, outputPath: "\(appPath)/\(iconName)@2x.png")
              alternateIcons[iconName] = [
                  "CFBundleIconFiles": [iconName],
                  "UIPrerenderedIcon": false
              ]
          }

          if let plist = NSMutableDictionary(contentsOfFile: plistPath) {
              var bundleIcons = (plist["CFBundleIcons"] as? [String: Any]) ?? [:]
              bundleIcons["CFBundleAlternateIcons"] = alternateIcons
              plist["CFBundleIcons"] = bundleIcons

              var ipadIcons = (plist["CFBundleIcons~ipad"] as? [String: Any]) ?? [:]
              ipadIcons["CFBundleAlternateIcons"] = alternateIcons
              plist["CFBundleIcons~ipad"] = ipadIcons

              plist.write(toFile: plistPath, atomically: true)
          }
          print("Generated \(hexColors.count) dynamic color icons preserving original S glyph.")
          EOF

          swift generate_icons.swift
          zip -qry Seekios.ipa Payload
          ls -lh Seekios.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Seekios-unsigned
          path: Seekios.ipa
          retention-days: 30

      - name: Keep build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

  release:
    name: GitHub Release
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Seekios-unsigned
          path: dist
      - name: Create automatic release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${VERSION}"
          fi

          file="dist/Seekios-${VERSION}.ipa"
          mv dist/Seekios.ipa "$file"

          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create "$TAG" "$file" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Seekios v${VERSION}" \
            --generate-notes

name: CI/CD

on:
  push:
    branches: [main, beta]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  ZSIGN_COMMIT: 614caa8d1ca949e260e5746144aa52d27a4b08d6

jobs:
  test:
    name: Protocol tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Install zlib headers
        run: apt-get update -qq && apt-get install -y -qq zlib1g-dev
      - name: Test SoulseekKit
        run: swift test --package-path Packages/SoulseekKit

  build:
    name: Build unsigned IPA
    needs: test
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out version numbers
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # Aumenta el número automáticamente en cada cambio (ej. 1.0.12, 1.0.13...)
            version="1.0.${GITHUB_RUN_NUMBER}"
          fi
          channel=stable
          if [[ "$GITHUB_REF" == refs/heads/beta || "$version" == *-* ]]; then channel=beta; fi
          version="${version%%-*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Version $version (build $GITHUB_RUN_NUMBER, $channel)"

      - name: Use the newest Xcode on the runner
        run: |
          latest="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | grep -vi beta | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set Seekios identity in project.yml and Generate project
        run: |
          sed -i '' 's/^name: .*/name: colon3/' project.yml
          sed -i '' "s/MARKETING_VERSION: .*/MARKETING_VERSION: \"${{ steps.version.outputs.version }}\"/g" project.yml
          sed -i '' 's/com\.aminewallah\.colon3/com.srjw.seekios/g' project.yml
          sed -i '' 's/com\.aminewallah/com.srjw/g' project.yml
          xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project colon3.xcodeproj \
            -scheme colon3 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            COLON3_CHANNEL="${{ steps.version.outputs.channel }}" \
            INFOPLIST_KEY_CFBundleDisplayName="Seekios" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee xcodebuild.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/colon3.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/colon3.app Payload/
          PLIST="Payload/colon3.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Seekios" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Seekios" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Seekios" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.srjw.seekios" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" "$PLIST" 2>/dev/null || true

          for PlugIn in Payload/colon3.app/PlugIns/*.appex; do
            if [ -f "$PlugIn/Info.plist" ]; then
              /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.srjw.seekios.widget" "$PlugIn/Info.plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" "$PlugIn/Info.plist" 2>/dev/null || true
            fi
          done

          zip -qry Seekios.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Seekios-unsigned
          path: Seekios.ipa
          retention-days: 30

      - name: Keep build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

  release:
    name: GitHub Release
    needs: build
    # Se ejecuta automáticamente en cada push a main o cuando se crea un tag v*
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Seekios-unsigned
          path: dist
      - name: Create automatic release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${VERSION}"
          fi

          file="dist/Seekios-${VERSION}.ipa"
          cp dist/Seekios.ipa "$file"

          # También adjunta Seekios.ipa con nombre fijo por si usas un link directo siempre igual
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create "$TAG" "$file" "dist/Seekios.ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Seekios v${VERSION}" \
            --generate-notes

name: CI/CD

on:
  push:
    branches: [main, beta]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out version numbers
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="1.0.${GITHUB_RUN_NUMBER}"
          fi
          channel=stable
          if [[ "$GITHUB_REF" == refs/heads/beta || "$version" == *-* ]]; then channel=beta; fi
          version="${version%%-*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Version $version (build $GITHUB_RUN_NUMBER, $channel)"

      - name: Use the newest Xcode on the runner
        run: |
          latest="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | grep -vi beta | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project colon3.xcodeproj \
            -scheme colon3 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            COLON3_CHANNEL="${{ steps.version.outputs.channel }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          if [ ! -f build/Build/Products/Release-iphoneos/colon3.app/colon3 ]; then
            echo "=== ERROR DE COMPILACION EN XCODE ==="
            grep -E "error:" xcodebuild.log -B 2 -A 2 || tail -n 50 xcodebuild.log
            exit 1
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/colon3.app Payload/
          zip -qry Seekios.ipa Payload
          ls -lh Seekios.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Seekios-unsigned
          path: Seekios.ipa
          retention-days: 30

      - name: Keep build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

  release:
    name: GitHub Release
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Seekios-unsigned
          path: dist
      - name: Create automatic release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${VERSION}"
          fi

          file="dist/Seekios-${VERSION}.ipa"
          mv dist/Seekios.ipa "$file"

          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create "$TAG" "$file" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Seekios v${VERSION}" \
            --generate-notes
